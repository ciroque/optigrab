name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
          - name: windows-x64
            os: windows-latest
          - name: macos-arm64
            os: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake pkg-config \
            libcdio-dev libcdio-paranoia-dev \
            ffmpeg cdparanoia

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew update
          # No Homebrew formula for classic "cdparanoia"; use libcdio-paranoia (linked) + ffmpeg.
          brew install cmake pkg-config libcdio libcdio-paranoia ffmpeg
          echo "PKG_CONFIG_PATH=$(brew --prefix)/lib/pkgconfig:${PKG_CONFIG_PATH:-}" >> "$GITHUB_ENV"
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"

      - name: Configure
        shell: bash
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DOPTIGRAB_VERSION=0.0.0-ci \
            -DOPTIGRAB_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure --timeout 120

      - name: Smoke (help via stdin)
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            BIN="build/Release/optigrab.exe"
            if [[ ! -f "$BIN" ]]; then BIN="build/optigrab.exe"; fi
          else
            BIN="build/optigrab"
          fi
          printf 'help\nlist drive\nexit\n' | "$BIN"
          "$BIN" --version || true
          "$BIN" -h || true
